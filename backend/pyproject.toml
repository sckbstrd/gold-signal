[project]
name = "gold-signal-backend"
version = "0.3.1"
description = "Gold Signal: transparent macro scoring engine and API"
requires-python = ">=3.11"
# The engine itself is pure standard library; these power ingestion, storage and the API.
dependencies = ["sqlalchemy>=2.0", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.32"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
